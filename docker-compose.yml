version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: syncsphere-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: syncsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncsphere-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SYNCSPHERE_ENVIRONMENT=local
      - SYNCSPHERE_DEBUG=true
      - SYNCSPHERE_MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/syncsphere?authSource=admin
      - SYNCSPHERE_REDIS_URI=redis://redis:6379/0
      - SYNCSPHERE_JWT_SECRET=supersecretjwtkeythatisthirtytwobyteslongtobesecure
      - SYNCSPHERE_MASTER_ENCRYPTION_KEY=z7pQYv_3e8q56_u-j-2W1S3K6L8_9x1v_3e8q56_u-I=
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: syncsphere-worker
    restart: always
    environment:
      - SYNCSPHERE_ENVIRONMENT=local
      - SYNCSPHERE_DEBUG=true
      - SYNCSPHERE_MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/syncsphere?authSource=admin
      - SYNCSPHERE_REDIS_URI=redis://redis:6379/0
      - SYNCSPHERE_JWT_SECRET=supersecretjwtkeythatisthirtytwobyteslongtobesecure
      - SYNCSPHERE_MASTER_ENCRYPTION_KEY=z7pQYv_3e8q56_u-j-2W1S3K6L8_9x1v_3e8q56_u-I=
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
