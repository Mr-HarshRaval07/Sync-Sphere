version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: syncsphere-prod-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpasswordprod
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syncsphere-net

  redis:
    image: redis:7.2-alpine
    container_name: syncsphere-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syncsphere-net

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: syncsphere-prod-api
    restart: always
    environment:
      - SYNCSPHERE_ENVIRONMENT=production
      - SYNCSPHERE_DEBUG=false
      - SYNCSPHERE_MONGODB_URI=mongodb://root:rootpasswordprod@mongodb:27017/syncsphere?authSource=admin
      - SYNCSPHERE_REDIS_URI=redis://redis:6379/0
      - SYNCSPHERE_JWT_SECRET=productionsecretkeyjwtrequiredlonglengthsecuresignings
      - SYNCSPHERE_MASTER_ENCRYPTION_KEY=z7pQYv_3e8q56_u-j-2W1S3K6L8_9x1v_3e8q56_u-I=
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - syncsphere-net

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: syncsphere-prod-worker
    restart: always
    environment:
      - SYNCSPHERE_ENVIRONMENT=production
      - SYNCSPHERE_DEBUG=false
      - SYNCSPHERE_MONGODB_URI=mongodb://root:rootpasswordprod@mongodb:27017/syncsphere?authSource=admin
      - SYNCSPHERE_REDIS_URI=redis://redis:6379/0
      - SYNCSPHERE_JWT_SECRET=productionsecretkeyjwtrequiredlonglengthsecuresignings
      - SYNCSPHERE_MASTER_ENCRYPTION_KEY=z7pQYv_3e8q56_u-j-2W1S3K6L8_9x1v_3e8q56_u-I=
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - syncsphere-net

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: syncsphere-prod-frontend
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_WS_URL=localhost:8000
    depends_on:
      - api
    networks:
      - syncsphere-net

  proxy:
    image: nginx:alpine
    container_name: syncsphere-prod-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - syncsphere-net

volumes:
  mongodb_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  syncsphere-net:
    driver: bridge
